<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia das Mães!</title>
    <style>
        :root {
            --cor-fundo: #fff5f7;
            --cor-primaria: #ff4d6d;
            --cor-secundaria: #ffb3c1;
            --cor-detalhes: #ff758f;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--cor-fundo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 500px;
        }

        h1 {
            color: var(--cor-primaria);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .foto-mae {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 15px;
            border: 5px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin: 1rem 0;
        }

        p {
            color: #555;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        /* Animação de Elementos Flutuantes */
        .elemento {
            position: absolute;
            bottom: -50px;
            font-size: 1.5rem;
            animation: subir 5s linear infinite;
            opacity: 0.7;
        }

        @keyframes subir {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        footer {
            margin-top: 1.5rem;
            color: var(--cor-detalhes);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="elementos-bg"></div>

    <div class="container">
        <h1>Feliz Dia das Mães!</h1>
        
        <img src="foto.jpg" alt="Foto com a Mamãe" class="foto-mae">

        <p>Para a pessoa que me ensinou o que é amor incondicional. Obrigado por ser minha luz, meu porto seguro e minha melhor amiga.</p>
        
        <footer>Com todo o meu amor ❤️</footer>
    </div>

    <script>
        function criarElementos() {
            const container = document.getElementById('elementos-bg');
            const icones = ['❤️', '⭐', '💖', '✨', '🌸'];
            
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'elemento';
                el.innerText = icones[Math.floor(Math.random() * icones.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                
                container.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 5000);
            }, 300);
        }

        criarElementos();
    </script>
</body>
</html>
